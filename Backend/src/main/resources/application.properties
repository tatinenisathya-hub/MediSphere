# =========================================================
# MediSphere Application Configuration
# =========================================================

spring.application.name=MediSphere


# =========================================================
# MongoDB Configuration
# =========================================================

spring.data.mongodb.uri=mongodb://localhost:27017/test


# =========================================================
# Server Configuration
# =========================================================

server.port=8080


# =========================================================
# Kafka Configuration
# =========================================================

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=medisphere-wearable-consumer

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.medisphere.kafka

spring.kafka.consumer.properties.spring.json.value.default.type=com.example.medisphere.kafka.WearableVitalEvent


# =========================================================
# Kafka Producer Configuration
# =========================================================

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# =========================================================
# External FHIR Server
# =========================================================

medisphere.fhir.external.base-url=https://hapi.fhir.org/baseR4


# =========================================================
# MediSphere AI Service
# =========================================================

medisphere.ai.base-url=http://localhost:8001


# =========================================================
# Logging Configuration - Quiet Terminal
# =========================================================

# Hide general framework INFO logs
logging.level.root=WARN

# Show MediSphere application logs
logging.level.com.example.medisphere=INFO


# =========================================================
# Kafka Logging
# =========================================================

# Hide Spring Kafka polling logs
logging.level.org.springframework.kafka=ERROR

logging.level.org.springframework.kafka.listener=ERROR

logging.level.org.springframework.kafka.listener.KafkaMessageListenerContainer=ERROR

# Reduce Apache Kafka logs
logging.level.org.apache.kafka=WARN

logging.level.org.apache.kafka.clients.consumer=WARN

logging.level.org.apache.kafka.clients.consumer.internals=ERROR


# =========================================================
# MongoDB Logging
# =========================================================

logging.level.org.mongodb.driver=WARN


# =========================================================
# Web Logging
# =========================================================

logging.level.org.springframework.web=WARN


# =========================================================
# DevTools Configuration
# =========================================================

# Disable automatic application restart
spring.devtools.restart.enabled=false

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

app.admin.setup-secret=${ADMIN_SETUP_SECRET}