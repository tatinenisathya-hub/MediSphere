spring.application.name=MediSphere

spring.data.mongodb.uri=mongodb://localhost:27017/

server.port=8080

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=medisphere-wearable-consumer

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.medisphere.kafka

spring.kafka.consumer.properties.spring.json.value.default.type=com.example.medisphere.kafka.WearableVitalEvent

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka.clients.consumer=INFO

# External FHIR Server
medisphere.fhir.external.base-url=https://hapi.fhir.org/baseR4